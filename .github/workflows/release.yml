name: Release

# Pousser un tag vX.Y.Z construit l'app Windows et publie l'installeur dans la release GitHub.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l'installeur et la version portable
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publier dans la release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Hourra $TAG" --generate-notes
          gh release upload "$TAG" dist/Hourra-Setup-*.exe dist/Hourra-Setup-*.exe.blockmap dist/latest.yml dist/Hourra-portable.exe --clobber

      - name: Garder les fichiers construits
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: hourra-windows
          path: |
            dist/Hourra-Setup-*.exe
            dist/Hourra-portable.exe
